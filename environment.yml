# Environment for Lumen.
#
# Regenerated from the live `lumen` environment with user-site packages
# disabled, so this file describes what actually runs. Before that fix,
# ~/.local/lib/python3.9/site-packages was on sys.path along with a sibling
# project's source tree injected by one of its .pth files, and 37 packages
# (including pytest, sympy, scikit-image and zarr) resolved from there rather
# than from the environment. typing_extensions was worse than missing: the
# environment held an older copy than the one actually imported, so a version
# recorded here would have looked right and still not reproduced.
#
# Create with:
#     conda env create -f environment.yml
#     conda activate lumen
#
# The activate hook in etc/conda/activate.d/nousersite.sh sets
# PYTHONNOUSERSITE=1. Keep it: without it this file stops being accurate.
